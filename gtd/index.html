<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="GTD">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-180.png">
    <link rel="icon" type="image/png" href="icon-180.png">
    <link rel="stylesheet" href="styles.css">
    <script type="module" src="app.js"></script>
    <title>GTD</title>
</head>

<body>
    <div class="app">
        <header class="top">
            <div class="top-text">
                <a class="back" id="back" href="#projects" hidden>
                    <svg viewBox="0 0 12 20" aria-hidden="true"><path d="M10 2 2 10l8 8"/></svg>Projects
                </a>
                <h1 id="title">Inbox</h1>
                <p class="subtitle" id="subtitle"></p>
            </div>
            <a class="pill" id="review-link" href="#review">Review<span class="dot" id="review-dot" hidden><span class="sr-only"> (due)</span></span></a>
        </header>

        <form class="quick-add" id="quick-add" autocomplete="off">
            <input id="quick-input" name="title" type="text" enterkeyhint="enter" aria-label="Add an item"
                placeholder="Capture anything…">
            <button type="submit" aria-label="Add">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            </button>
        </form>

        <main id="view"></main>
    </div>

    <nav class="tabbar" aria-label="Lists">
        <a href="#inbox" data-tab="inbox">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 13.5 5.6 6.3A2 2 0 0 1 7.5 5h9a2 2 0 0 1 1.9 1.3l2.6 7.2V18a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M3 13.5h5.2l1.3 2.5h5l1.3-2.5H21"/></svg>
            <span>Inbox</span><span class="badge" id="inbox-badge" hidden></span>
        </a>
        <a href="#next" data-tab="next">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8 12.4 2.7 2.7 5.5-5.6"/></svg>
            <span>Next</span>
        </a>
        <a href="#projects" data-tab="projects">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5h3.4l2 2.2h7.6A2.5 2.5 0 0 1 21 9.7v7.8a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5z"/></svg>
            <span>Projects</span>
        </a>
        <a href="#waiting" data-tab="waiting">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7.5V12l3 2"/></svg>
            <span>Waiting</span>
        </a>
        <a href="#someday" data-tab="someday">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="5" rx="1.5"/><path d="M5 9v9a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V9M10 13h4"/></svg>
            <span>Someday</span>
        </a>
    </nav>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <dialog class="sheet" id="sheet" aria-label="Item details"></dialog>
    <input type="file" id="import-file" accept=".json,application/json" hidden>
    <noscript><p class="noscript">This app needs JavaScript.</p></noscript>
</body>

</html>
